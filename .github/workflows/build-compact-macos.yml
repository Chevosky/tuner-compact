name: Build Tuner Compact for Intel

# A normal manual run only builds an artifact. Publishing is deliberate:
# either publish=true, or a push that increases COMPACT_REVISION.
on:
  push:
    branches: [compact-intel]
    paths: [egui/src/version.rs]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a new stable Compact release after tests and build succeed'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 35
    outputs:
      version: ${{ steps.package.outputs.version }}
      revision: ${{ steps.package.outputs.revision }}
      tag: ${{ steps.package.outputs.tag }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup target add --toolchain 1.96.0 x86_64-apple-darwin

      - name: Test release validation without publishing
        run: node scripts/test-compact-release.mjs

      - name: Run native tuner tests on macOS Intel
        run: rustup run 1.96.0 cargo test --locked -p audio-input -p guitar-tuner-egui

      - name: Build and verify the Big Sur package
        id: package
        run: bash scripts/build-compact-macos.command

      - name: Validate the updater against the newly built package
        env:
          TUNER_QA_RELEASE_ZIP: ${{ steps.package.outputs.artifact_directory }}/${{ steps.package.outputs.zip_name }}
          TUNER_QA_RELEASE_MACHO: ${{ steps.package.outputs.artifact_directory }}/Tuner Compact.app/Contents/MacOS/guitar-tuner-egui
        run: >-
          rustup run 1.96.0 cargo test --locked -p guitar-tuner-egui
          updates::tests::real_release_fixture_when_explicitly_provided -- --exact

      - name: Upload the verified ZIP and update metadata
        uses: actions/upload-artifact@v4
        with:
          name: Tuner-Compact-macos-Intel
          path: |
            ${{ steps.package.outputs.artifact_directory }}/${{ steps.package.outputs.zip_name }}
            ${{ steps.package.outputs.artifact_directory }}/${{ steps.package.outputs.checksum_name }}
            ${{ steps.package.outputs.artifact_directory }}/${{ steps.package.outputs.manifest_name }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish-release:
    needs: macos-intel
    if: >-
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)) &&
      needs.macos-intel.result == 'success' && github.repository == 'Chevosky/tuner-compact'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The build job never receives a token that can change the repository.
    permissions:
      contents: write
    concurrency:
      group: tuner-compact-release-publication
      cancel-in-progress: false
    steps:
      - name: Download only the artifact from this successful run
        uses: actions/download-artifact@v4
        with:
          name: Tuner-Compact-macos-Intel
          path: ${{ runner.temp }}/tuner-compact-release

      - name: Validate, upload to a draft, then publish the complete release
        uses: actions/github-script@v7
        env:
          COMPACT_ARTIFACT_DIRECTORY: ${{ runner.temp }}/tuner-compact-release
          EXPECTED_VERSION: ${{ needs.macos-intel.outputs.version }}
          EXPECTED_REVISION: ${{ needs.macos-intel.outputs.revision }}
          EXPECTED_TAG: ${{ needs.macos-intel.outputs.tag }}
        with:
          script: |
            // BEGIN COMPACT_RELEASE_PUBLISHER
            // This code is also executed with a fake GitHub API by the tests.
            // No checkout or build tools run in this job with contents:write.
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const expectedRepository = 'Chevosky/tuner-compact';
            const fail = (message) => { throw new Error(message); };
            const publishingPush = context.eventName === 'push';
            const publishingDispatch = context.eventName === 'workflow_dispatch' && String(context.payload.inputs?.publish) === 'true';
            if (!publishingPush && !publishingDispatch) {
              fail('Publication requires an explicit revision push or workflow_dispatch with publish=true.');
            }
            if (`${context.repo.owner}/${context.repo.repo}` !== expectedRepository) {
              fail('This update channel belongs to Chevosky/tuner-compact.');
            }
            const defaultBranch = context.payload.repository?.default_branch;
            if (!defaultBranch || context.ref !== `refs/heads/${defaultBranch}`) {
              fail('Publish from the default branch after merging the tested release changes.');
            }
            if (!/^[0-9a-f]{40}$/.test(context.sha)) fail('Missing build commit.');

            const directory = process.env.COMPACT_ARTIFACT_DIRECTORY;
            if (!directory) fail('Missing artifact directory.');
            const readFile = (name, maximum) => {
              const filename = path.join(directory, name);
              const stat = fs.lstatSync(filename);
              if (!stat.isFile() || stat.size < 1 || stat.size > maximum) {
                fail(`Invalid release asset: ${name}`);
              }
              return fs.readFileSync(filename);
            };
            const manifestName = 'tuner-compact-update.json';
            const manifestBytes = readFile(manifestName, 16384);
            const manifest = JSON.parse(manifestBytes.toString('utf8'));
            const versionPattern = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/;
            if (manifest === null || Array.isArray(manifest) || typeof manifest !== 'object' ||
                manifest.schema_version !== 1 || typeof manifest.version !== 'string' ||
                !versionPattern.test(manifest.version) || !Number.isSafeInteger(manifest.revision) ||
                manifest.revision < 1 || manifest.revision > 999999999) {
              fail('Invalid update manifest version or revision.');
            }
            const tag = `compact-v${manifest.version}-r${manifest.revision}`;
            const zipName = `Tuner-Compact-v${manifest.version}-r${manifest.revision}-macos-x86_64.app.zip`;
            const checksumName = `${zipName}.sha256`;
            if (manifest.version !== process.env.EXPECTED_VERSION ||
                String(manifest.revision) !== process.env.EXPECTED_REVISION ||
                tag !== process.env.EXPECTED_TAG || manifest.tag !== tag ||
                manifest.asset !== zipName || manifest.platform !== 'macos' ||
                manifest.arch !== 'x86_64' || manifest.minimum_macos !== '11.0' ||
                manifest.bundle_id !== 'com.tuner.guitar.compact' || manifest.executable !== 'guitar-tuner-egui' ||
                manifest.url !== `https://github.com/${expectedRepository}/releases/download/${tag}/${zipName}` ||
                typeof manifest.sha256 !== 'string' || !/^[0-9a-f]{64}$/.test(manifest.sha256)) {
              fail('Update metadata does not match the successful Intel build.');
            }
            const expectedNames = [zipName, checksumName, manifestName].sort();
            if (JSON.stringify(fs.readdirSync(directory).sort()) !== JSON.stringify(expectedNames)) {
              fail('The release artifact must contain exactly the ZIP, SHA-256 file and manifest.');
            }
            const zipBytes = readFile(zipName, 256 * 1024 * 1024);
            const checksumBytes = readFile(checksumName, 1024);
            const digest = (bytes) => crypto.createHash('sha256').update(bytes).digest('hex');
            if (digest(zipBytes) !== manifest.sha256 ||
                checksumBytes.toString('utf8') !== `${manifest.sha256}  ${zipName}\n`) {
              fail('ZIP, manifest and checksum do not agree. Nothing was published.');
            }
            const files = [
              { name: zipName, bytes: zipBytes, type: 'application/zip' },
              { name: checksumName, bytes: checksumBytes, type: 'text/plain' },
              { name: manifestName, bytes: manifestBytes, type: 'application/json' },
            ];

            // Requiring the current default-branch commit also avoids asking a
            // GITHUB_TOKEN to create a tag that changes protected workflow files.
            const branch = await github.rest.repos.getBranch({ ...context.repo, branch: defaultBranch });
            if (branch.data.commit.sha !== context.sha) {
              fail('The default branch changed during this build. Start a new publish run.');
            }
            if (publishingPush) {
              const before = context.payload.before;
              if (typeof before !== 'string' || !/^[0-9a-f]{40}$/.test(before)) {
                fail('The push is missing its previous commit.');
              }
              if (before !== '0'.repeat(40)) {
                // First verify the commit, so an inaccessible commit is never
                // mistaken for the initial creation of version.rs.
                await github.rest.repos.getCommit({ ...context.repo, ref: before });
                let previousSource;
                try {
                  const result = await github.rest.repos.getContent({
                    ...context.repo, ref: before, path: 'egui/src/version.rs',
                  });
                  if (result.data.type !== 'file' || result.data.encoding !== 'base64') {
                    fail('Cannot read the previous Compact revision.');
                  }
                  previousSource = Buffer.from(result.data.content, 'base64').toString('utf8');
                } catch (error) {
                  if (error.status !== 404) throw error;
                  // A verified commit without this file is the first Compact
                  // revision; adding it is an explicit publication signal.
                }
                if (previousSource !== undefined) {
                  const previous = /^pub const COMPACT_REVISION: u64 = ([1-9][0-9]*);$/m.exec(previousSource);
                  if (!previous || BigInt(previous[1]) >= BigInt(manifest.revision)) {
                    fail('A push only publishes when COMPACT_REVISION increases.');
                  }
                }
              }
            }
            const [tags, releases] = await Promise.all([
              github.paginate(github.rest.repos.listTags, { ...context.repo, per_page: 100 }),
              github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 }),
            ]);
            const knownTags = new Set([...tags.map((item) => item.name), ...releases.map((item) => item.tag_name)]);
            if (knownTags.has(tag)) {
              fail(`Tag or release ${tag} already exists. Existing releases are never overwritten; increase COMPACT_REVISION.`);
            }
            const currentVersion = manifest.version.split('.').map(BigInt);
            for (const previousTag of knownTags) {
              const previous = /^compact-v(\d+)\.(\d+)\.(\d+)-r(\d+)$/.exec(previousTag);
              if (!previous) continue;
              if (BigInt(previous[4]) >= BigInt(manifest.revision)) {
                fail(`COMPACT_REVISION must exceed every existing Compact revision, including ${previousTag}.`);
              }
              const previousVersion = previous.slice(1, 4).map(BigInt);
              const difference = currentVersion.findIndex((part, index) => part !== previousVersion[index]);
              if (difference !== -1 && currentVersion[difference] < previousVersion[difference]) {
                fail(`The application version cannot go backwards from ${previousTag}.`);
              }
            }

            // Creating the ref is atomic: if another actor reserved the same
            // tag after our read, fail rather than release a different commit.
            await github.rest.git.createRef({
              ...context.repo, ref: `refs/tags/${tag}`, sha: context.sha,
            });
            try {
              const { data: draft } = await github.rest.repos.createRelease({
                ...context.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `Tuner Compact ${manifest.version} · revisión ${manifest.revision}`,
                body: [
                  'Afinador para Mac Intel, macOS Big Sur 11.0 o posterior.',
                  `Descargá **${zipName}**. El archivo SHA-256 y el manifest acompañan al mismo paquete verificado.`,
                  `Compilado y probado desde el commit \`${context.sha}\`.`,
                  'La app conserva el identificador com.tuner.guitar.compact y las licencias incluidas.',
                ].join('\n\n'),
                draft: true,
                prerelease: false,
              });
              if (!draft.draft || draft.tag_name !== tag) fail('GitHub did not return the expected draft.');
              for (const file of files) {
                await github.rest.repos.uploadReleaseAsset({
                  ...context.repo,
                  release_id: draft.id,
                  name: file.name,
                  headers: { 'content-type': file.type, 'content-length': file.bytes.length },
                  data: file.bytes,
                });
              }
              const uploaded = await github.paginate(github.rest.repos.listReleaseAssets, {
                ...context.repo, release_id: draft.id, per_page: 100,
              });
              if (uploaded.length !== files.length) fail('The draft has an incomplete asset set.');
              for (const file of files) {
                const matches = uploaded.filter((asset) => asset.name === file.name);
                if (matches.length !== 1 || matches[0].state !== 'uploaded' || matches[0].size !== file.bytes.length ||
                    (matches[0].digest && matches[0].digest !== `sha256:${digest(file.bytes)}`)) {
                  fail(`GitHub could not verify the uploaded asset ${file.name}.`);
                }
              }
              const { data: published } = await github.rest.repos.updateRelease({
                ...context.repo, release_id: draft.id, draft: false, prerelease: false, make_latest: 'true',
              });
              if (published.draft || published.prerelease || published.tag_name !== tag) {
                fail('GitHub did not confirm a stable release.');
              }
              core.setOutput('release_url', published.html_url);
              core.notice(`Published ${published.html_url}`);
            } catch (error) {
              core.warning(`Publication did not finish cleanly. Inspect tag/draft/release ${tag}; a reserved revision is never reused automatically.`);
              throw error;
            }
            // END COMPACT_RELEASE_PUBLISHER
