[workspace]
resolver = "2"
exclude = ["vendor/cpal"]
members = [
    "audio-input",
    "pitch-core",
    "egui",
    "test-support",
]

[workspace.package]
version = "0.1.13"
edition = "2021"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/themoretheless/tuner"

# Common profile settings for the workspace (native + future wasm)
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Keep CPAL 0.15.3 and its existing macOS API/dependency baseline. The local
# backport breaks the CoreAudio disconnect-listener ownership cycle.
[patch.crates-io]
cpal = { path = "vendor/cpal" }
